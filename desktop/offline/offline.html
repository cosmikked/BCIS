<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
    <title>BCIS: cannot reach the server</title>
    <link rel="stylesheet" href="offline.css">
</head>
<body>
    <main>
        <h1>Cannot reach the BCIS server</h1>
        <p id="message">The server did not answer. Check that the server PC is on and that this PC is on the office network.</p>
        <p>Server address: <code id="server-url">not set</code></p>
        <p class="note">Nothing is saved on this PC while the server is down. Payments and other work cannot be recorded until the connection returns.</p>
        <button id="retry" type="button">Retry</button>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="offline.js"></script>
</body>
</html>
